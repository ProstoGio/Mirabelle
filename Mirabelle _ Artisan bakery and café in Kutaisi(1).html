<style>
:root{--cream:#f7f0e3;--paper:#fffaf0;--wine:#661e24;--ink:#271b18;--blush:#ecd0cc;--crust:#b87a35;--serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;box-sizing:border-box;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#1d1311;--paper:#2a1a17;--wine:#e9b9b6;--ink:#f4ead9;--blush:#4a2a2b}}
:root[data-theme=dark]{--cream:#1d1311;--paper:#2a1a17;--wine:#e9b9b6;--ink:#f4ead9;--blush:#4a2a2b}
*,::before,::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.6 var(--sans);-webkit-text-size-adjust:100%}
a:focus-visible,button:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.visit :focus-visible{outline-color:var(--cream)}
h1,h2{margin:0;font-family:var(--serif);font-variation-settings:"SOFT" 100;color:var(--wine)}
h2{font-weight:600;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin-bottom:1.5rem;text-wrap:balance}
.pad{padding:clamp(3rem,8vw,7rem) clamp(1.25rem,5vw,4rem)}
.top{-webkit-user-select:none;user-select:none;position:fixed;inset:0 0 auto;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:calc(.7rem + env(safe-area-inset-top,0px)) clamp(1.25rem,5vw,4rem) .7rem;color:var(--cream);transition:background .3s,color .3s}
.top.solid{background:color-mix(in srgb,var(--cream) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--wine);box-shadow:0 1px 0 color-mix(in srgb,var(--wine) 18%,transparent)}
.brand{display:flex;align-items:center;gap:.55rem;color:inherit;text-decoration:none;font:700 1.5rem var(--serif);font-variation-settings:"SOFT" 100}
.brand svg{width:2rem;height:2rem}
.top nav{display:flex;gap:.2rem;align-items:center;padding:.25rem;border-radius:99px;background:color-mix(in srgb,currentColor 10%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.top nav a{display:inline-flex;align-items:center;min-height:40px;padding:0 1.1rem;border-radius:99px;color:inherit;text-decoration:none;font-weight:600;transition:background .2s,transform .2s,box-shadow .2s}
.top nav a:hover{background:color-mix(in srgb,currentColor 16%,transparent);transform:translateY(-1px)}
.top nav a[aria-current]{background:color-mix(in srgb,currentColor 20%,transparent)}
.top nav .tel{background:var(--cream);color:var(--wine);box-shadow:0 .25rem .8rem rgba(0,0,0,.22)}
.top.solid nav .tel{background:var(--wine);color:var(--cream)}
.top nav .tel:hover{background:var(--cream);box-shadow:0 .4rem 1rem rgba(0,0,0,.3);transform:translateY(-2px)}
.top.solid nav .tel:hover{background:var(--wine)}
.top.glass:not(.solid){background:color-mix(in srgb,var(--wine) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 0 color-mix(in srgb,var(--cream) 14%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1.5rem;border-radius:99px;border:2px solid var(--wine);background:var(--wine);color:var(--cream);font:600 1rem var(--sans);text-decoration:none}
.btn.alt{background:none;color:var(--wine)}
@property --a{syntax:"<angle>";inherits:false;initial-value:360deg}
@keyframes sweep{from{--a:0deg}to{--a:360deg}}
@keyframes rise{from{opacity:0;translate:0 12px}}
@keyframes pop{from{scale:.4;opacity:0}}
@keyframes fadein{from{opacity:0;scale:1.06}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.hero{cursor:default;-webkit-user-select:none;user-select:none;position:relative;overflow:hidden;min-height:max(100svh,640px);display:flex;align-items:flex-end;background:var(--wine);color:var(--cream);padding:7rem clamp(1.25rem,5vw,4rem) clamp(1.5rem,4vw,3rem)}
.mark{pointer-events:none;position:absolute;left:-10%;top:50%;translate:0 -50%;width:clamp(380px,60vw,900px);aspect-ratio:1;color:var(--cream);opacity:.1;rotate:var(--r,0deg);-webkit-mask-image:conic-gradient(#000 var(--a),transparent calc(var(--a) + .5deg));mask-image:conic-gradient(#000 var(--a),transparent calc(var(--a) + .5deg));animation:sweep 2s cubic-bezier(.4,0,.2,1) both}
.hl{position:relative;z-index:2;width:100%;pointer-events:none}
.top:not(.glass):not(.solid){pointer-events:none}.top:not(.glass):not(.solid) a,.top:not(.glass):not(.solid) button{pointer-events:auto}
.discs{pointer-events:none}.d{pointer-events:auto}
.lede{max-width:24ch;margin:0 0 1rem;font:500 clamp(1.2rem,2.2vw,1.7rem)/1.3 var(--serif);animation:rise .9s .4s both}
.status{display:inline-flex;align-items:center;margin:0 0 1.2rem;padding:.4rem 1rem;border:1.5px solid color-mix(in srgb,var(--cream) 55%,transparent);border-radius:99px;font-weight:600;font-size:.95rem;animation:rise .9s .55s both}
.status i{width:.6rem;height:.6rem;border-radius:50%;background:#ecd0cc;margin-right:.6rem;flex:none}
.status.closed i{background:#150c0a;box-shadow:0 0 0 1.5px var(--cream)}
.hero h1{display:block;width:fit-content;color:var(--cream)}
.wm{display:block;font-weight:700;font-size:min(17.5vw,17rem);line-height:.9;letter-spacing:-.03em;font-variation-settings:"opsz" 144,"SOFT" 100;animation:rise 1s .6s both}
.sub{display:flex;justify-content:space-between;margin-top:.6rem;font:italic 500 clamp(1.1rem,2.4vw,1.8rem) var(--serif);font-variation-settings:"SOFT" 100;animation:rise 1s .8s both}
.discs{position:absolute;inset:0}
.d{position:absolute;z-index:1;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:min(calc(var(--s)*1vw),30rem);aspect-ratio:1;padding:0;border:0;border-radius:50%;overflow:hidden;cursor:pointer;background:var(--blush);box-shadow:0 0 0 .4rem var(--cream),0 1.5rem 3rem rgba(0,0,0,.35);translate:calc(var(--px,0)*var(--k)*1px) calc(var(--py,0)*var(--k)*1px);transition:translate .3s ease-out;animation:pop .9s calc(.3s + var(--i)*.14s) cubic-bezier(.2,1.3,.4,1) both}
.d img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .5s}
.d:hover img,.d:focus-visible img{scale:1.1}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,250,240,.5) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.3s infinite}
.menu{background:var(--paper)}
.cats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem}
.cats button,.pairs button{min-height:44px;padding:0 1.1rem;border:1.5px solid var(--wine);border-radius:99px;background:none;color:var(--wine);font:inherit;cursor:pointer;transition:background .2s,color .2s}
.cats button[aria-pressed=true],.pairs button[aria-pressed=true]{background:var(--wine);color:var(--cream)}
.board{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(2rem,6vw,6rem);align-items:start}
#list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:baseline;gap:.6rem;width:100%;min-height:52px;padding:.75rem 1rem;border:0;border-left:3px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.item b{font:600 1.3rem/1.2 var(--serif);font-variation-settings:"SOFT" 100;color:var(--wine)}
.item i{flex:1;border-bottom:2px dotted color-mix(in srgb,var(--crust) 70%,transparent);translate:0 -.25rem}
.item span{flex:none;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.item:hover,.item[aria-current=true]{background:var(--blush)}
.item[aria-current=true]{border-left-color:var(--wine)}
.sk{height:3.4rem;margin:.5rem 0;border-radius:12px;background:var(--blush);position:relative;overflow:hidden}
.detail{position:sticky;top:5.5rem;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3rem);align-items:center}
.stage{position:relative;width:100%;transition:transform .2s ease-out;transform:perspective(900px) rotateY(calc(var(--tx,0)*6deg)) rotateX(calc(var(--ty,0)*-6deg))}
.arch{position:relative;margin:0;aspect-ratio:4/5;border-radius:999px 999px 1.5rem 1.5rem;overflow:hidden;background:var(--blush)}
.arch img{display:block;width:100%;height:100%;object-fit:cover}
.arch .ph{display:none;position:absolute;inset:22%;width:56%;height:56%;color:var(--wine);opacity:.5}
.arch.noimg img{display:none}.arch.noimg .ph{display:block}
.seal{position:absolute;right:-12%;bottom:6%;width:36%;filter:drop-shadow(0 .5rem 1rem rgba(0,0,0,.25))}
.s-bg{fill:var(--wine)}.seal text{fill:var(--cream);font:600 10.5px var(--sans)}.seal #sealp{font:700 21px var(--serif)}
.ring{transform-origin:60px 60px;animation:spin 24s linear infinite}
.swap .txt{animation:rise .5s both}.swap .arch img{animation:fadein .5s both}

dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;align-items:baseline;font-size:.95rem}dt{font-weight:600;color:var(--wine)}dd{margin:0}
.craft{display:grid;grid-template-columns:auto 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:center;max-width:1100px;margin:0 auto}

.visit{position:relative;overflow:hidden;background:var(--wine);color:var(--cream)}
.visit h2{color:var(--cream)}

[hidden]{display:none!important}
.hero,.visit,.foot{--wine:#661e24;--cream:#f7f0e3;--blush:#ecd0cc}
.top:not(.solid){--wine:#661e24;--cream:#f7f0e3}
:root[data-theme=dark] .hero,:root[data-theme=dark] .visit,:root[data-theme=dark] .foot{--wine:#2b0e12;--cream:#f4ead9}
:root[data-theme=dark] .top:not(.solid){--wine:#2b0e12;--cream:#f4ead9}

}
.rev{background:var(--cream)}
